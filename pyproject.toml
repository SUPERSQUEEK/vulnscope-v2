[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscope2"
version = "2.0.0"
description = "Scoped async vulnerability assessment with active validation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vulnscope2 = "vulnscope2.__main__:main"

[tool.setuptools.packages.find]
include = ["vulnscope2*"]
